<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050">
  <defs>
    <style>
      .bg { fill: #f7f7f2; }
      .title { font: 700 42px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #202124; }
      .subtitle { font: 400 22px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #5f6368; }
      .step-title { font: 700 25px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #202124; }
      .step-text { font: 400 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #4d5156; }
      .small { font: 400 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #5f6368; }
      .small-dark { font: 400 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #6f5312; }
      .tag { font: 700 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #ffffff; }
      .loop-label { font: 700 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #8c6a18; }
      .card { fill: #ffffff; stroke: #d8d6ce; stroke-width: 2; }
      .note { fill: #fff6db; stroke: #e7c96a; stroke-width: 2; }
      .blue { fill: #dbeafe; stroke: #7da7e8; }
      .green { fill: #dff3e4; stroke: #7dbc8a; }
      .rose { fill: #fbe1df; stroke: #e58c85; }
      .gold { fill: #fff0bf; stroke: #e3b84c; }
      .teal { fill: #d8f3f1; stroke: #73b9b4; }
      .ink { stroke: #34373b; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #565a5f; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .return-arrow { stroke: #8c6a18; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 8; marker-end: url(#arrow-gold); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#565a5f"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c6a18"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="1050"/>

  <text class="title" x="700" y="74" text-anchor="middle">德州扑克 AI 策略工具：LBS 新手流程图</text>
  <text class="subtitle" x="700" y="113" text-anchor="middle">一句话：先猜对手范围，再展开未来打法，最后用 EV 选出更好的策略</text>

  <rect class="note" x="110" y="148" width="1180" height="78" rx="14"/>
  <text class="step-title" x="145" y="183">LBS 是什么？</text>
  <text class="step-text" x="145" y="212">Learned Belief Search = 学习式信念搜索。Belief 表示“AI 对对手范围的判断”，Search 表示“在策略树里搜索最佳打法”。</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect class="card blue" x="80" y="280" width="300" height="170" rx="18"/>
  </g>
  <rect x="104" y="304" width="64" height="82" rx="8" fill="#ffffff" stroke="#2763b8" stroke-width="3"/>
  <rect x="124" y="324" width="64" height="82" rx="8" fill="#ffffff" stroke="#2763b8" stroke-width="3"/>
  <text class="step-title" x="194" y="322">1. 输入牌局</text>
  <text class="step-text" x="194" y="360">手牌、公共牌、位置</text>
  <text class="step-text" x="194" y="389">底池、筹码、行动历史</text>
  <text class="small" x="194" y="421">例：BTN vs BB，翻牌后决策</text>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect class="card green" x="550" y="280" width="300" height="170" rx="18"/>
  </g>
  <circle cx="620" cy="352" r="34" fill="#ffffff" stroke="#2f7d44" stroke-width="3"/>
  <path class="ink" d="M645 377 L672 404"/>
  <path class="ink" d="M604 348 C612 335 631 335 638 350"/>
  <path class="ink" d="M604 366 C616 376 632 375 641 363"/>
  <text class="step-title" x="674" y="322">2. 猜对手范围</text>
  <text class="step-text" x="674" y="360">根据对手动作更新概率</text>
  <text class="step-text" x="674" y="389">哪些牌还可能在他手里</text>
  <text class="small" x="674" y="421">这一步叫 Belief Model</text>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect class="card gold" x="1020" y="280" width="300" height="170" rx="18"/>
  </g>
  <circle cx="1088" cy="335" r="10" fill="#ffffff" stroke="#9b7117" stroke-width="3"/>
  <circle cx="1055" cy="390" r="10" fill="#ffffff" stroke="#9b7117" stroke-width="3"/>
  <circle cx="1122" cy="390" r="10" fill="#ffffff" stroke="#9b7117" stroke-width="3"/>
  <path class="ink" d="M1088 345 L1055 380 M1088 345 L1122 380"/>
  <text class="step-title" x="1145" y="322">3. 策略树</text>
  <text class="step-text" x="1145" y="360">列出后续动作</text>
  <text class="step-text" x="1145" y="389">下注、过牌、跟注</text>
  <text class="small" x="1145" y="421">动作越多，计算越贵</text>

  <!-- Arrows row 1 -->
  <path class="arrow" d="M390 365 C440 365 488 365 540 365"/>
  <path class="arrow" d="M860 365 C910 365 958 365 1010 365"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect class="card teal" x="1020" y="560" width="300" height="170" rx="18"/>
  </g>
  <rect x="1052" y="601" width="78" height="92" rx="10" fill="#ffffff" stroke="#34807a" stroke-width="3"/>
  <line class="ink" x1="1066" y1="625" x2="1116" y2="625"/>
  <line class="ink" x1="1066" y1="647" x2="1116" y2="647"/>
  <line class="ink" x1="1066" y1="669" x2="1098" y2="669"/>
  <text class="step-title" x="1145" y="602">4. 搜索 EV</text>
  <text class="step-text" x="1145" y="640">比较每条路线收益</text>
  <text class="step-text" x="1145" y="669">EV 高的动作优先</text>
  <text class="small" x="1145" y="701">Value Model 可加速</text>

  <!-- Step 5 -->
  <g filter="url(#shadow)">
    <rect class="card rose" x="550" y="560" width="300" height="170" rx="18"/>
  </g>
  <rect x="590" y="608" width="88" height="70" rx="14" fill="#ffffff" stroke="#b6423c" stroke-width="3"/>
  <path class="ink" d="M608 643 L626 660 L660 623"/>
  <text class="step-title" x="704" y="602">5. 输出策略建议</text>
  <text class="step-text" x="704" y="640">不是只给一个答案</text>
  <text class="step-text" x="704" y="669">而是给动作频率和原因</text>
  <text class="small" x="704" y="701">例：小下注 62%，过牌 31%</text>

  <!-- Step 6 -->
  <g filter="url(#shadow)">
    <rect class="card blue" x="80" y="560" width="300" height="170" rx="18"/>
  </g>
  <rect x="120" y="608" width="90" height="70" rx="14" fill="#ffffff" stroke="#2763b8" stroke-width="3"/>
  <path class="ink" d="M136 630 L194 630 M136 652 L176 652"/>
  <path d="M196 678 L216 704 L214 676" fill="#ffffff" stroke="#2763b8" stroke-width="3" stroke-linejoin="round"/>
  <text class="step-title" x="236" y="602">6. 中文解释</text>
  <text class="step-text" x="236" y="640">把计算结果说成人话</text>
  <text class="step-text" x="236" y="669">讲范围、赔率、下注尺度</text>
  <text class="small" x="236" y="701">适合复盘和训练</text>

  <!-- Arrows row 2 -->
  <path class="arrow" d="M1170 460 C1170 492 1170 520 1170 550"/>
  <path class="arrow" d="M1010 645 C958 645 910 645 860 645"/>
  <path class="arrow" d="M540 645 C488 645 440 645 390 645"/>

  <!-- Training loop -->
  <rect class="note" x="250" y="815" width="730" height="135" rx="18"/>
  <text class="step-title" x="292" y="854">训练回流：让 AI 越学越像 Solver</text>
  <text class="step-text" x="292" y="890">把搜索结果、Solver 答案、用户复盘数据保存下来，</text>
  <text class="step-text" x="292" y="918">继续训练 Belief Model、Policy Model 和 Value Model。</text>
  <text class="small-dark" x="292" y="941">早期：规则 + 小策略树；中期：加入 PioSOLVER / GTO+ 数据。</text>
  <path class="return-arrow" d="M250 875 C120 875 45 700 80 490 C92 430 100 415 113 450"/>
  <text class="loop-label" x="78" y="817">持续优化</text>

  <!-- Tiny policy example -->
  <rect x="1030" y="810" width="260" height="142" rx="14" fill="#ffffff" stroke="#d8d6ce" stroke-width="2"/>
  <text class="step-title" x="1060" y="846">输出示例</text>
  <text class="step-text" x="1060" y="881">下注 33%：62%</text>
  <text class="step-text" x="1060" y="910">过牌：31%</text>
  <text class="step-text" x="1060" y="939">下注 75%：7%</text>

  <text class="small" x="700" y="1008" text-anchor="middle">建议 MVP：BTN vs BB 单挑底池 + 固定下注尺度 + 搜索 1-2 街，先把流程跑通。</text>
</svg>
